<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>理科 ○×クイズ</title>

<style>
body{
  font-family:sans-serif;
  background:#f0f4f8;
  text-align:center;
  padding:20px;
  margin:0;
}

/* ===== カード ===== */
.card{
  background:white;
  max-width:750px;
  margin:40px auto;
  padding:35px;
  border-radius:20px;
  box-shadow:0 6px 15px rgba(0,0,0,0.15);
}

/* 問題番号 */
#questionNumber{
  font-size:18px;
  color:#666;
  margin-bottom:15px;
}

/* 問題文 */
#question{
  font-size:26px;
  line-height:1.8;
  margin:20px 0 30px 0;
}

/* ===== ボタン共通 ===== */
button{
  font-size:22px;
  margin:15px;
  padding:15px 35px;
  border:none;
  border-radius:15px;
  cursor:pointer;
  transition:0.2s;
}

/* ○ボタン */
.btn-maru{
  background:#e53935;
  color:white;
}
.btn-maru:hover{
  background:#b71c1c;
}

/* ×ボタン */
.btn-batsu{
  background:#1e88e5;
  color:white;
}
.btn-batsu:hover{
  background:#0d47a1;
}

/* 次の問題へボタン（黒文字） */
.btn-next{
  background:#e0e0e0;
  color:black;
}
.btn-next:hover{
  background:#cfcfcf;
}

.hidden{display:none;}

.review{
  text-align:left;
  max-width:800px;
  margin:auto;
}

/* ===== 固定 問題一覧ボタン ===== */
#nav{
  position:fixed;
  top:15px;
  right:15px;
  z-index:1000;
}

#nav a{
  display:inline-block;
  padding:12px 18px;
  background:#1976d2;
  color:white;
  text-decoration:none;
  font-weight:bold;
  border-radius:25px;
  box-shadow:0 4px 8px rgba(0,0,0,0.25);
  transition:0.2s;
}
#nav a:hover{
  background:#0f4c8a;
  transform:scale(1.05);
}
</style>
</head>

<body>

<div id="nav">
  <a href="R7_mondai_list.pdf" target="_blank">
    📘 ○×問題一覧
  </a>
</div>

<h1>理科 ○×クイズ</h1>

<div id="loading">読み込み中...</div>

<div id="quiz" class="hidden card">
  <div id="questionNumber"></div>
  <div id="question"></div>
  <button class="btn-maru" onclick="answer('○')">○</button>
  <button class="btn-batsu" onclick="answer('×')">×</button>
</div>

<div id="explanation" class="hidden card">
  <h3 id="result"></h3>
  <p id="comment"></p>
  <button class="btn-next" onclick="nextQuestion()">次の問題へ</button>
</div>

<div id="resultScreen" class="hidden card">
  <h2 id="score"></h2>
  <button class="btn-next" onclick="restart()">🔁 もう一度挑戦</button>
  <button class="btn-next" onclick="showReview()">📊 解答振り返り</button>
</div>

<div id="reviewScreen" class="hidden card">
  <h2>解答振り返り</h2>
  <div id="reviewList" class="review"></div>
  <button class="btn-next" onclick="restart()">🔁 再挑戦</button>
</div>

<script>
let questions=[];
let quiz=[];
let current=0;
let score=0;
let history=[];

fetch("questions.csv")
.then(res=>res.text())
.then(text=>{
  const lines=text.trim().split("\n").slice(1);
  questions=lines.map(line=>{
    const [q,a,c]=line.split(",");
    return {q,a:a.trim(),c};
  });
  startQuiz();
})
.catch(()=>{
  document.getElementById("loading").innerText="読み込みに失敗しました";
});

function startQuiz(){
  quiz=questions.sort(()=>Math.random()-0.5).slice(0,10);
  current=0;
  score=0;
  history=[];
  document.getElementById("loading").classList.add("hidden");
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("reviewScreen").classList.add("hidden");
  showQuestion();
}

function showQuestion(){
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("explanation").classList.add("hidden");
  document.getElementById("questionNumber").innerText=
    `第 ${current+1} 問 / 10 問`;
  document.getElementById("question").innerText=
    quiz[current].q;
}

function answer(ans){
  const q=quiz[current];
  const correct=ans===q.a;
  if(correct)score++;

  history.push({
    question:q.q,
    your:ans,
    correct:q.a,
    comment:q.c
  });

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("explanation").classList.remove("hidden");
  document.getElementById("result").innerText=
    correct?"⭕ 正解！":"❌ 不正解";
  document.getElementById("comment").innerText=q.c;
}

function nextQuestion(){
  current++;
  if(current<quiz.length){
    showQuestion();
  }else{
    showResult();
  }
}

function showResult(){
  document.getElementById("explanation").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");
  document.getElementById("score").innerText=
    `10問中 ${score} 問 正解！`;
}

function restart(){
  startQuiz();
}

function showReview(){
  document.getElementById("resultScreen").classList.add("hidden");
  document.getElementById("reviewScreen").classList.remove("hidden");

  const list=document.getElementById("reviewList");
  list.innerHTML="";

  history.forEach((h,i)=>{
    list.innerHTML+=`
      <p>
      <strong>第${i+1}問：</strong>${h.question}<br>
      あなたの答え：${h.your}<br>
      正解：${h.correct}<br>
      解説：${h.comment}
      </p>
      <hr>
    `;
  });
}
</script>

</body>
</html>
